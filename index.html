 case 'camera-fallback':E(state.cameraFacing==='user'?'selfieFallback':'rearFallback').click();break;
 case 'channel':state.channel=idx;render();staticSound();break;
 case 'rename-channel':modal('COMMS / CHANNEL NAMES',state.channels.map((x,i)=>inputField(`CHANNEL 0${i+1}`,`ch${i}`,'Channel name',x)).join(''),`<button class="btn" data-action="close-modal">CANCEL</button><button class="btn primary" data-action="save-channels">SAVE</button>`);break;
 case 'save-channels':state.channels=state.channels.map((x,i)=>E(`ch${i}`)?.value.trim().slice(0,16)||x);saveState();closeModal();render();toast('Kanäle gespeichert');break;
 case 'ptt':await toggleRecord();break;
 case 'radio-message':modal('COMMS / PRESET PHRASES',`<div class="button-grid">${['POSITION BESTÄTIGT','SYSTEM BEREIT','WEGPUNKT ERREICHT','RÜCKKEHR ZUR BASIS','AUFTRAG ABGESCHLOSSEN'].map((x,i)=>`<button class="btn" data-action="preset-say" data-idx="${i}">${x}</button>`).join('')}</div><div class="notice" style="margin-top:9px">Simulierte Meldungen. Es erfolgt keine Funkübertragung.</div>`);break;
 case 'preset-say':staticSound();beep(530+idx*45,.09);toast(['POSITION BESTÄTIGT','SYSTEM BEREIT','WEGPUNKT ERREICHT','RÜCKKEHR ZUR BASIS','AUFTRAG ABGESCHLOSSEN'][idx]);break;
 case 'radio-static':staticSound();break;
 case 'play-media':await playMedia(id);break;
 case 'delete-media':askConfirm('DELETE RECORDING','Aufnahme unwiderruflich löschen?','confirm-delete-media',id);break;
 case 'confirm-delete-media':await dbDel('media',id);state.media=state.media.filter(m=>m.id!==id);closeModal();render();break;
 case 'radar-audio':state.radarAudio=!state.radarAudio;if(state.radarAudio)audio();toast(state.radarAudio?'Radar-Pieptöne an':'Radar-Pieptöne aus');render();break;
 case 'tool-sos':openSos();break;
 case 'tool-timer':openTimer();break;
 case 'tool-level':openLevel();break;
 case 'tool-settings':openSettings();break;
 case 'tool-stealth':openStealth();break;
 case 'tool-backup':await exportBackup();break;
 case 'tool-lock':lock(true);break;
 case 'timer-set':state.timerSeconds=Number(element.dataset.seconds);state.timerUntil=null;openTimer();break;
 case 'timer-start':{let mins=Number(E('timerCustom')?.value);if(Number.isFinite(mins)&&mins>=1&&mins<=240)state.timerSeconds=Math.round(mins*60);state.timerUntil=Date.now()+state.timerSeconds*1000;state.timerAlarmDone=false;toast('Countdown gestartet');openTimer();break;}
 case 'timer-stop':state.timerUntil=null;state.timerAlarmDone=false;openTimer();break;
 case 'set-theme':setTheme(value);openSettings();break;
 case 'set-power':state.powerSave=value==='1';putSetting('powerSave',state.powerSave);openSettings();toast(state.powerSave?'Power Save aktiv':'Normalmodus aktiv');break;
 case 'set-quiet':state.quiet=value==='1';putSetting('quiet',state.quiet);openSettings();break;
 case 'backup-export':await exportBackup();break;
 case 'backup-import':E('backupInput').click();break;
 default:console.warn('Unknown action',action);
 }}
function lock(on){state.locked=on;E('touchLock').hidden=!on;if(on){setNav(false);toast('Eingaben gesperrt · 2 Sekunden halten zum Entsperren')}else{const progress=E('unlockProgress');progress.style.transition='none';progress.style.width='0';beep(950,.1);toast('Eingaben entsperrt')}}
function makeHold(button,onLong){let timer=null,start=null;const begin=e=>{if(e.button!=null&&e.button!==0)return;start=Date.now();if(button.id==='unlockTrigger'){const bar=E('unlockProgress');bar.style.transition='none';bar.style.width='0';requestAnimationFrame(()=>{bar.style.transition='width 2s linear';bar.style.width='100%'})}timer=setTimeout(()=>{timer=null;onLong()},2000)};const end=()=>{if(timer){clearTimeout(timer);timer=null;}if(button.id==='unlockTrigger'){const bar=E('unlockProgress');bar.style.transition='none';bar.style.width='0'}};button.addEventListener('pointerdown',begin);button.addEventListener('pointerup',end);button.addEventListener('pointercancel',end);button.addEventListener('pointerleave',end);button.addEventListener('contextmenu',e=>e.preventDefault())}
let touch=null;function setUpGestures(){const shell=E('appShell');shell.addEventListener('touchstart',e=>{if(e.touches.length!==1||state.locked||E('modalRoot').classList.contains('has-modal')){touch=null;return}const t=e.touches[0],target=e.target;touch={x:t.clientX,y:t.clientY,target,at:Date.now()};},{passive:true});shell.addEventListener('touchend',e=>{if(!touch||e.changedTouches.length!==1){touch=null;return}const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y,from=touch;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;if(from.target.closest('#mapSurface,.modal,.nav-dock,input,textarea,select,button')){
 // Nav: a downward gesture started on nav hides it.
 if(from.target.closest('#navDock')&&dy>45&&Math.abs(dy)>Math.abs(dx)){setNav(false);return}return;
 }
 if(Math.abs(dy)>Math.abs(dx)*1.25){const h=window.innerHeight;if(dy< -55&&from.y>h-115){setNav(true);return}if(dy>55&&state.nav){setNav(false);return}return}
 if(Math.abs(dx)>65){if(state.nav)setNav(false);const index=PAGES.indexOf(state.page);go(PAGES[(index+(dx<0?1:-1)+PAGES.length)%PAGES.length]);}
 },{passive:true})}
function mapInteractions(){const cv=E('mapCanvas');if(!cv)return;let pointers=new Map(),start=null,moved=0;cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});start={x:e.clientX,y:e.clientY,center:{...state.map.center}};moved=0});cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!start)return;const old=pointers.get(e.pointerId);moved+=Math.hypot(e.clientX-old.x,e.clientY-old.y);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=cv.getBoundingClientRect();const scale=Math.min(r.width,r.height)/(state.map.halfKm*2*1000);state.map.center={lat:state.map.center.lat+(e.clientY-old.y)/scale/111320,lon:state.map.center.lon-(e.clientX-old.x)/scale/(111320*Math.cos(state.map.center.lat*Math.PI/180))}});cv.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(moved<8&&start){const r=cv.getBoundingClientRect(),geo=XYToGeo(e.clientX-r.left,e.clientY-r.top,r.width,r.height);addWaypointModal(geo)}start=null});cv.addEventListener('pointercancel',()=>{pointers.clear();start=null});cv.addEventListener('wheel',e=>{e.preventDefault();state.map.halfKm=Math.max(.15,Math.min(35,state.map.halfKm*(e.deltaY>0?1.2:.8)))},{passive:false})}
function updateTimer(){if(!state.timerUntil)return;const remain=state.timerUntil-Date.now();if(E('timerText'))E('timerText').textContent=formatTimer();if(remain<=0&&!state.timerAlarmDone){state.timerAlarmDone=true;state.timerUntil=null;beep(820,.2);setTimeout(()=>beep(1020,.18),260);toast('COUNTDOWN COMPLETE');if(E('timerText'))E('timerText').textContent='00:00:00'}}
function updateLevel(){if(!E('levelDot'))return;const p=state.pitch,r=state.roll;E('levelDot').style.transform=`translate(${Number.isFinite(r)?Math.max(-55,Math.min(55,r*1.25)):0}px,${Number.isFinite(p)?Math.max(-55,Math.min(55,p*1.25)):0}px)`;if(E('levelPitch'))E('levelPitch').textContent=p==null?'—':round(p,1)+'°';if(E('levelRoll'))E('levelRoll').textContent=r==null?'—':round(r,1)+'°'}
let bootTimer=null;async function boot(){E('bootSymbol').innerHTML=crest;E('brandEmblem').innerHTML=crest;let begin=performance.now(),welcome='Willkommen zurück, Meister',modules=['ENCRYPTED VISUAL PROTOCOL','NAV / RADAR INTERFACE','LOCAL MISSION DATABASE','OFFLINE GRID MODULES','SENSOR CONNECTION PENDING'];const duration=4350;function tick(){const elapsed=performance.now()-begin,k=Math.max(0,Math.min(1,elapsed/duration));E('bootProgress').style.width=Math.floor(k*100)+'%';E('bootPercent').textContent=String(Math.floor(k*100)).padStart(2,'0')+'%';if(elapsed>850){let length=Math.floor((elapsed-850)/38);E('bootWelcome').textContent=welcome.slice(0,Math.min(welcome.length,length))+(length<welcome.length?'▌':'')}if(elapsed>2100){let idx=Math.min(modules.length-1,Math.floor((elapsed-2100)/390));E('bootModules').innerHTML=`<span class="live">${modules[idx]} <span style="color:#c8ffd6">${idx===4?'WAIT':'VISUAL OK'}</span></span><span>LOCAL MODULE SEQUENCE / SIMULATION</span>`}if(elapsed>3750)E('bootEnd').classList.add('show');if(elapsed<duration)bootTimer=requestAnimationFrame(tick);else{E('bootScreen').classList.add('exit');setTimeout(()=>{E('bootScreen').remove();state.boot=false;state.bootComplete=true;render();toast('FIELD OPS ONLINE')},500)}}requestAnimationFrame(tick)}
async function startup(){await initPersist();render();setUpGestures();makeHold(E('lockTrigger'),()=>lock(true));makeHold(E('unlockTrigger'),()=>lock(false));document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(target){e.preventDefault();if(state.locked&&!target.closest('#touchLock'))return;Promise.resolve(handleAction(target,e)).catch(err=>{console.error(err);toast('Aktion fehlgeschlagen','error')})}});
 const refreshRender=render;render= function(){refreshRender();if(state.page==='MAP')mapInteractions()};
 E('geojsonInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(file)await importGeoJSON(file);e.target.value=''});
 E('backupInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(file)await importBackup(file);e.target.value=''});
 for(const [id] of [['selfieFallback'],['rearFallback']])E(id).addEventListener('change',async e=>{const file=e.target.files?.[0];if(file)await savePhoto(file);e.target.value=''});
 window.addEventListener('online',()=>{state.online=true;updateHeader()});window.addEventListener('offline',()=>{state.online=false;updateHeader()});
 setInterval(()=>{updateLive();updateTimer();updateLevel();},700);
 requestAnimationFrame(drawFrame);await boot();
 if('serviceWorker'in navigator&&window.isSecureContext&&location.protocol!=='file:'){
   navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{
     setTimeout(()=>toast('OFFLINE CORE READY · App-Dateien gespeichert'),state.boot?5200:0);
   }).catch(e=>{console.warn('Offline cache registration:',e);toast('Offline-Dateien konnten nicht gespeichert werden','warn')});
 }
 if(location.protocol==='file:')setTimeout(()=>toast('Dateivorschau: GPS, Kamera und Offline-Installation benötigen HTTPS','warn'),5200);
}
// Called only after all assets loaded.
window.addEventListener('DOMContentLoaded',()=>startup().catch(err=>{console.error(err);E('bootScreen')?.remove();render();toast('Startproblem – bitte neu öffnen','error')}));
})();

</script>
